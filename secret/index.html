<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>leftunsaid.world</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--border:rgba(255,255,255,0.07);--bg:#050505;}
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:'Outfit',sans-serif;font-weight:300;cursor:none;}
    a,button{cursor:none;}

    #cursor-ring{position:fixed;width:34px;height:34px;border:1px solid rgba(255,255,255,.35);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .45s cubic-bezier(.25,.46,.45,.94),height .45s cubic-bezier(.25,.46,.45,.94),border-radius .25s,opacity .3s ease;mix-blend-mode:difference;opacity:0;}
    #noise{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.022;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;}
    #chaos-flash{position:fixed;inset:0;z-index:99999;background:#fff;display:none;pointer-events:none;}
    #veil{position:fixed;inset:0;background:#000;z-index:999;pointer-events:none;opacity:1;transition:opacity .3s ease;}

    /* INTRO */
    #intro{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:1000;pointer-events:none;}
    #intro-stack{position:relative;width:220px;height:220px;opacity:0;animation:introFade 3.2s ease forwards;}
    @keyframes introFade{0%{opacity:0;transform:scale(.8)}25%{opacity:1;transform:scale(1)}65%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(8)}}
    #intro-globe-wrap{position:absolute;top:50%;left:50%;width:100%;height:100%;margin-top:-50%;margin-left:-50%;}
    #intro-globe{width:100%;height:100%;transform-origin:49.6% 47.2%;}
    #intro-lu{width:100%;height:100%;transform-origin:48.8% 47.6%;}
    #intro-lu-wrap{position:absolute;top:50%;left:50%;width:71.5%;height:71.5%;margin-top:-35.75%;margin-left:-35.75%;}
    #intro.done{display:none;}

    #main{opacity:0;}
    #main.visible{opacity:1;}

    /* NAV */
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.5rem 3rem;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);}
    nav a.nav-logo img{height:102px;opacity:.9;display:block;}
    nav ul{list-style:none;display:flex;gap:2.5rem;}
    nav ul li a{color:rgba(255,255,255,.6);text-decoration:none;font-family:'Outfit',sans-serif;font-weight:300;font-size:12px;letter-spacing:.2em;text-transform:uppercase;transition:color .3s;}
    nav ul li a:hover{color:#fff;}

    /* GLOBE CANVAS */
    #globe-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:2;}

    /* HOVER TAG */
    #region-tag{position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .25s ease;display:flex;flex-direction:column;gap:3px;padding:0;}
    #region-tag.visible{opacity:1;}
    #rt-region{font-size:8px;letter-spacing:.5em;text-transform:uppercase;color:rgba(255,255,255,.3);}
    #rt-artist{font-family:'Syne',sans-serif;font-size:.78rem;font-weight:600;letter-spacing:.08em;color:rgba(255,255,255,.88);}
    #rt-hint{font-size:7px;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.2);margin-top:2px;}

    /* POPUP */
    #music-popup{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .4s ease;}
    #music-popup.open{opacity:1;pointer-events:all;}
    #popup-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);}
    #popup-inner{position:relative;z-index:1;background:rgba(5,5,5,.97);border:1px solid rgba(255,255,255,.08);width:min(400px,92vw);transform:translateY(22px) scale(.96);transition:transform .45s cubic-bezier(.16,1,.3,1);}
    #music-popup.open #popup-inner{transform:translateY(0) scale(1);}
    #popup-head{display:flex;align-items:flex-start;justify-content:space-between;padding:1.6rem 1.6rem 1rem;}
    #popup-region{font-size:8px;letter-spacing:.5em;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:.35rem;}
    #popup-artist{font-family:'Syne',sans-serif;font-size:.9rem;font-weight:600;letter-spacing:.08em;color:rgba(255,255,255,.9);}
    #popup-sub{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.22);margin-top:.25rem;}
    #popup-close{background:none;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);width:26px;height:26px;font-size:15px;font-family:'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;transition:border-color .3s,color .3s;flex-shrink:0;margin-top:2px;}
    #popup-close:hover{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.8);}

    /* Waveform */
    #popup-wave{display:flex;align-items:flex-end;gap:2px;height:24px;padding:0 1.6rem;margin-bottom:.9rem;}
    .wb{flex:1;border-radius:1px;background:rgba(255,255,255,.18);animation:wa 1s ease infinite alternate;transform-origin:bottom;}
    .wb:nth-child(1){height:30%;animation-delay:.00s}.wb:nth-child(2){height:65%;animation-delay:.07s}.wb:nth-child(3){height:45%;animation-delay:.14s}.wb:nth-child(4){height:80%;animation-delay:.02s}.wb:nth-child(5){height:55%;animation-delay:.10s}.wb:nth-child(6){height:90%;animation-delay:.18s}.wb:nth-child(7){height:40%;animation-delay:.05s}.wb:nth-child(8){height:70%;animation-delay:.22s}.wb:nth-child(9){height:50%;animation-delay:.09s}.wb:nth-child(10){height:85%;animation-delay:.16s}.wb:nth-child(11){height:35%;animation-delay:.03s}.wb:nth-child(12){height:60%;animation-delay:.20s}.wb:nth-child(13){height:75%;animation-delay:.12s}.wb:nth-child(14){height:42%;animation-delay:.06s}.wb:nth-child(15){height:58%;animation-delay:.17s}.wb:nth-child(16){height:28%;animation-delay:.11s}
    @keyframes wa{from{transform:scaleY(.15);opacity:.25}to{transform:scaleY(1);opacity:.75}}
    #popup-wave.paused .wb{animation-play-state:paused;}

    #popup-embed{border-top:1px solid var(--border);}
    #popup-embed iframe{display:block;width:100%;border:none;}

    /* FOOTER */
    footer{position:fixed;bottom:0;left:0;right:0;z-index:100;border-top:1px solid var(--border);padding:1.1rem 3rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);}
    footer img{height:22px;opacity:.22;}
    #copyright-magnet{font-size:10px;color:rgba(255,255,255,.15);letter-spacing:.2em;display:flex;user-select:none;font-family:'Outfit',sans-serif;}
    #copyright-magnet .mc{display:inline-block;will-change:transform;}
    .footer-links{display:flex;gap:2rem;}
    .footer-links a{font-size:10px;color:rgba(255,255,255,.22);text-decoration:none;letter-spacing:.25em;text-transform:uppercase;transition:color .3s;}
    .footer-links a:hover{color:rgba(255,255,255,.7);}

    @media(max-width:768px){
      body{cursor:auto;}
      #cursor-ring{display:none;}
      nav{padding:1rem 1.2rem;}
      nav a.nav-logo img{height:60px;}
      nav ul{gap:1.2rem;}
      nav ul li a{font-size:10px;letter-spacing:.12em;}
      footer{padding:.9rem 1.2rem;}
      footer img{height:18px;}
      .footer-links{gap:1.2rem;}
    }
  </style>
</head>

</div>

<script>
(function(){
'use strict';

/* ── UTILS ── */
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function rand(a,b){return a+Math.random()*(b-a);}

/* ── CURSOR ── */
var isMob=('ontouchstart' in window)&&!window.matchMedia('(pointer:fine)').matches;
var rng=document.getElementById('cursor-ring');
var gMX=innerWidth/2, gMY=innerHeight/2;
if(isMob){rng.style.display='none';document.body.style.cursor='auto';}
else{
  var mx=gMX,my=gMY,rx=mx,ry=my;
  document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;gMX=e.clientX;gMY=e.clientY;});
  (function rl(){rx+=(mx-rx)*.22;ry+=(my-ry)*.22;rng.style.left=rx+'px';rng.style.top=ry+'px';requestAnimationFrame(rl);})();
  function ringReset(){rng.style.width='34px';rng.style.height='34px';rng.style.borderRadius='50%';}
  document.querySelectorAll('a').forEach(function(el){
    el.addEventListener('mouseenter',function(){rng.style.width='68px';rng.style.height='68px';rng.style.borderRadius='50%';});
    el.addEventListener('mouseleave',ringReset);
  });
}

/* ── GLOBE MATH ── */
function latLonToXYZ(lat,lon){
  var phi=(90-lat)*Math.PI/180, the=(lon+180)*Math.PI/180;
  return{x:Math.sin(phi)*Math.cos(the), y:Math.cos(phi), z:Math.sin(phi)*Math.sin(the)};
}
function rotPt(p,rx,ry){
  var cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);
  var x1=p.x*cy-p.z*sy, z1=p.x*sy+p.z*cy;
  return{x:x1, y:p.y*cx-z1*sx, z:p.y*sx+z1*cx};
}
var W,H,CX,CY,R;
function proj(p){
  var fov=2.4, sc=fov/(fov+p.z+1.6);
  return{x:CX+p.x*R*sc, y:CY+p.y*R*sc};
}

  AU:[114,-22,114,-34,116,-35,119,-35,122,-34,127,-34,130,-30,131,-13,133,-12,136,-12,140,-15,143,-10,145,-14,150,-24,153,-28,152,-31,151,-34,143,-39,141,-38,135,-35,131,-32],
  GL:[-45,83,-20,83,-18,77,-25,70,-45,60,-55,64,-65,67,-66,73],
  IS:[114,-22],/* placeholder */
};

/* Pre-compute 3D coords for continents */
var CONT3D = Object.keys(RAW).filter(function(k){return k!=='IS';}).map(function(k){
  return parsePoly(RAW[k]).map(function(pt){return latLonToXYZ(pt.lat,pt.lon);});
});

/* Lat/Lon grid */
var GRID={lat:[],lon:[]};
(function(){
  for(var la=-75;la<=75;la+=15){
    var r=[];for(var lo=-180;lo<=180;lo+=5)r.push(latLonToXYZ(la,lo));
    GRID.lat.push(r);
  }
  for(var lo=-180;lo<180;lo+=20){
    var r=[];for(var la=-90;la<=90;la+=5)r.push(latLonToXYZ(la,lo));
    GRID.lon.push(r);
  }
})();

/* Pre-compute 3D for regions */
REGIONS.forEach(function(r){
  r.cent3D=latLonToXYZ(r.cent.lat,r.cent.lon);
  r.polys3D=r.polys.map(function(poly){
    return poly.map(function(pt){return latLonToXYZ(pt.lat,pt.lon);});

/* ── GLOBE STATE ── */
var canvas=document.getElementById('globe-canvas');
var ctx=canvas.getContext('2d');
var rotX=0.22, rotY=0.35;
var velX=0, velY=0;
var dragging=false, spinning=true;
var spinSpd=0.0012;
var dragActive=false, dsx=0, dsy=0;
var DRAG_THRESH=6;
var hoveredRegion=null;
var mouseOnCanvas=false;

function resize(){
  W=canvas.width=canvas.offsetWidth;
  H=canvas.height=canvas.offsetHeight;
  CX=W/2; CY=H/2;
  R=Math.min(W,H)*0.44;
}
resize();
window.addEventListener('resize',resize);

/* ── DRAW HELPERS ── */
function drawPolyLine(pts3D,color,lineW){
  ctx.beginPath();
  var started=false, prevVis=false;
  for(var i=0;i<=pts3D.length;i++){
    var p=pts3D[i%pts3D.length];
    var rp=rotPt(p,rotX,rotY);
    var vis=rp.z>-0.04;
    if(!vis){started=false;prevVis=false;continue;}
    var pp=proj(rp);
    if(!started||!prevVis){ctx.moveTo(pp.x,pp.y);}
    else{ctx.lineTo(pp.x,pp.y);}
    started=true; prevVis=true;
  }
  ctx.strokeStyle=color;
  ctx.lineWidth=lineW||0.6;
  ctx.stroke();
}

function drawPolyFill(pts3D,fillColor,strokeColor,strokeW){
  ctx.beginPath();
  var first=true;
  for(var i=0;i<pts3D.length;i++){
    var rp=rotPt(pts3D[i],rotX,rotY);
    if(rp.z<-0.08){first=true;continue;}
    var pp=proj(rp);
    if(first){ctx.moveTo(pp.x,pp.y);first=false;}
    else ctx.lineTo(pp.x,pp.y);
  }
  ctx.closePath();
  if(fillColor){ctx.fillStyle=fillColor;ctx.fill();}
  if(strokeColor){ctx.strokeStyle=strokeColor;ctx.lineWidth=strokeW||1;ctx.stroke();}
}

/* ── MAIN DRAW LOOP ── */
var frame=0;
function draw(){
  requestAnimationFrame(draw);
  frame++;

  if(!dragActive){
    if(spinning){
      rotY+=spinSpd;
    } else {
      velX*=0.94; velY*=0.94;
      rotY+=velX; rotX+=velY;
      if(Math.abs(velX)<0.00008&&Math.abs(velY)<0.00008) spinning=true;
    }
  }
  rotX=clamp(rotX,-Math.PI/2.2,Math.PI/2.2);

  ctx.clearRect(0,0,W,H);

  /* Outer glow */
  var grd=ctx.createRadialGradient(CX,CY,R*0.05,CX,CY,R*1.4);
  grd.addColorStop(0,'rgba(255,255,255,0.012)');
  grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);

  /* Clip to globe disc */
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX,CY,R,0,Math.PI*2);
  ctx.clip();

  /* Continent fills (very faint) */
  CONT3D.forEach(function(pts3){
    drawPolyFill(pts3,'rgba(255,255,255,0.035)',null,0);
  });

  /* Grid wireframe */
  GRID.lat.forEach(function(pts){
    ctx.beginPath();
    var s=false,pv=false;
    pts.forEach(function(p){
      var rp=rotPt(p,rotX,rotY);
      if(rp.z<-0.04){s=false;pv=false;return;}
      var pp=proj(rp);
      if(!s||!pv){ctx.moveTo(pp.x,pp.y);}else{ctx.lineTo(pp.x,pp.y);}
      s=true;pv=true;
    });
    ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=0.5;ctx.stroke();
  });
  GRID.lon.forEach(function(pts){
    ctx.beginPath();
    var s=false,pv=false;
    pts.forEach(function(p){
      var rp=rotPt(p,rotX,rotY);
      if(rp.z<-0.04){s=false;pv=false;return;}
      var pp=proj(rp);
      if(!s||!pv){ctx.moveTo(pp.x,pp.y);}else{ctx.lineTo(pp.x,pp.y);}
      s=true;pv=true;
    });
    ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=0.5;ctx.stroke();
  });

  /* Continent outlines */
  CONT3D.forEach(function(pts3){
    drawPolyLine(pts3,'rgba(255,255,255,0.18)',0.7);
  });

  /* Highlighted regions */
  REGIONS.forEach(function(r){
    var cRot=rotPt(r.cent3D,rotX,rotY);
    var visible=cRot.z>-0.15;
    var targetA=visible&&hoveredRegion===r?1:0;
    r.hA+=(targetA-r.hA)*0.09;

    var baseAlpha=0.12;
    var strokeAlpha=baseAlpha+r.hA*0.75;
    var fillAlpha=0.03+r.hA*0.09;

    /* pulse on hover */
    var pulse=r.hA>0.05?(0.85+0.15*Math.sin(frame*0.08)):1;
    strokeAlpha*=pulse;

    r.polys3D.forEach(function(pts3){
      drawPolyFill(pts3,
        'rgba(255,255,255,'+fillAlpha.toFixed(3)+')',
        'rgba(255,255,255,'+strokeAlpha.toFixed(3)+')',
        r.hA>0.1?1.8:1
      );
    });
  });

  ctx.restore(); /* end globe clip */

  /* Globe edge ring */
  ctx.beginPath();
  ctx.arc(CX,CY,R,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,0.07)';
  ctx.lineWidth=1;
  ctx.stroke();

  /* Region labels (projected text) */
  if(hoveredRegion){
    var cRot=rotPt(hoveredRegion.cent3D,rotX,rotY);
    if(cRot.z>0.1){
      var pp=proj(cRot);
      ctx.save();
      ctx.globalAlpha=hoveredRegion.hA;
      ctx.font='700 9px Syne,sans-serif';
      ctx.letterSpacing='0.3em';
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.textAlign='center';
      ctx.fillText(hoveredRegion.label.toUpperCase(),pp.x,pp.y-6);
      ctx.font='300 7px Outfit,sans-serif';
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.fillText(hoveredRegion.artist,pp.x,pp.y+8);
      ctx.restore();
    }
  }
}
draw();

/* ── HIT DETECTION ── */
function pip2D(px,py,pts2D){
  var inside=false,n=pts2D.length;
  for(var i=0,j=n-1;i<n;j=i++){
    var xi=pts2D[i].x,yi=pts2D[i].y,xj=pts2D[j].x,yj=pts2D[j].y;
    if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}

function detectRegion(mx,my){
  for(var i=0;i<REGIONS.length;i++){
    var r=REGIONS[i];
    var cRot=rotPt(r.cent3D,rotX,rotY);
    if(cRot.z<0) continue;
    for(var j=0;j<r.polys3D.length;j++){
      var pts2D=r.polys3D[j].map(function(p){
        var rp=rotPt(p,rotX,rotY);
        return proj(rp);
      });
      if(pip2D(mx,my,pts2D)) return r;
    }
  }
  return null;
}

/* ── MOUSE INTERACTION ── */
var mouseX=0, mouseY=0;
canvas.addEventListener('mousemove',function(e){
  var rect=canvas.getBoundingClientRect();
  mouseX=e.clientX-rect.left; mouseY=e.clientY-rect.top;
  mouseOnCanvas=true;
  if(dragActive) return;

  hoveredRegion=detectRegion(mouseX,mouseY);

  /* Update hover tag */
  var tag=document.getElementById('region-tag');
  if(hoveredRegion){
    document.getElementById('rt-region').textContent=hoveredRegion.label+' · '+hoveredRegion.sub;
    document.getElementById('rt-artist').textContent=hoveredRegion.artist;
    tag.style.left=(e.clientX+18)+'px';
    tag.style.top=(e.clientY-20)+'px';
    tag.classList.add('visible');
    rng.style.width='62px';rng.style.height='62px';rng.style.borderRadius='50%';
  } else {
    tag.classList.remove('visible');
    rng.style.width='34px';rng.style.height='34px';rng.style.borderRadius='50%';
  }
});

canvas.addEventListener('mouseleave',function(){
  mouseOnCanvas=false;
  hoveredRegion=null;
  document.getElementById('region-tag').classList.remove('visible');
  rng.style.width='34px';rng.style.height='34px';rng.style.borderRadius='50%';
});

/* Drag */
canvas.addEventListener('mousedown',function(e){
  dragActive=true; dragging=false; spinning=false;
  dsx=e.clientX; dsy=e.clientY;
  velX=0; velY=0;
  e.preventDefault();
});
document.addEventListener('mousemove',function(e){
  if(!dragActive) return;
  var dx=e.clientX-dsx, dy=e.clientY-dsy;
  if(!dragging&&Math.sqrt(dx*dx+dy*dy)>DRAG_THRESH) dragging=true;
  if(!dragging) return;
  rotY+=dx*0.007; rotX+=dy*0.005;
  velX=dx*0.007; velY=dy*0.005;
  dsx=e.clientX; dsy=e.clientY;
});
document.addEventListener('mouseup',function(){
  if(!dragActive) return;
  dragActive=false;
  if(!dragging){ /* click */
    var rect=canvas.getBoundingClientRect();
    var r=detectRegion(dsx-rect.left,dsy-rect.top);
    if(r) openPopup(r);
  }
  dragging=false;
});

/* Touch */
var tSx=0,tSy=0,tDragging=false,tActive=false,tVX=0,tVY=0,tLX=0,tLY=0;
canvas.addEventListener('touchstart',function(e){
  tActive=true; tDragging=false; spinning=false;
  tSx=e.touches[0].clientX; tSy=e.touches[0].clientY;
  tLX=tSx; tLY=tSy; tVX=0; tVY=0;
  document.getElementById('region-tag').classList.remove('visible');
},{passive:true});
document.addEventListener('touchmove',function(e){
  if(!tActive) return;
  var dx=e.touches[0].clientX-tLX, dy=e.touches[0].clientY-tLY;
  var tdx=e.touches[0].clientX-tSx, tdy=e.touches[0].clientY-tSy;
  if(!tDragging&&Math.sqrt(tdx*tdx+tdy*tdy)>DRAG_THRESH) tDragging=true;
  if(!tDragging) return;
  rotY+=dx*0.007; rotX+=dy*0.005;
  tVX=dx*0.007; tVY=dy*0.005;
  tLX=e.touches[0].clientX; tLY=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',function(e){
  if(!tActive) return;
  if(!tDragging){
    var rect=canvas.getBoundingClientRect();
    var tx=e.changedTouches[0].clientX-rect.left;
    var ty=e.changedTouches[0].clientY-rect.top;
    var r=detectRegion(tx,ty);
    if(r) openPopup(r);
  } else {
    velX=tVX; velY=tVY; spinning=false;
  }
  tActive=false; tDragging=false;
},{passive:true});

/* ── POPUP ── */
var popup=document.getElementById('music-popup');
var popupBg=document.getElementById('popup-bg');
var popupClose=document.getElementById('popup-close');
var popupEmbed=document.getElementById('popup-embed');
var popupWave=document.getElementById('popup-wave');

function openPopup(region){
  document.getElementById('popup-region').textContent=region.label.toUpperCase()+' — '+region.sub.toUpperCase();
  document.getElementById('popup-artist').textContent=region.artist;
  document.getElementById('popup-sub').textContent='leftunsaid collective';

  /* Pick random track */
  var tid=region.tracks[Math.floor(Math.random()*region.tracks.length)];
  popupEmbed.innerHTML='<iframe src="https://open.spotify.com/embed/track/'+tid+'?utm_source=generator&theme=0" height="152" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>';

  popupWave.classList.remove('paused');
  popup.classList.add('open');
}

function closePopup(){
  popup.classList.remove('open');
  popupWave.classList.add('paused');
  setTimeout(function(){popupEmbed.innerHTML='';},450);
}

popupClose.addEventListener('click',closePopup);
popupBg.addEventListener('click',closePopup);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePopup();});

/* ── INTRO ANIMATION (original) ── */
var INTRO_DUR=3200,introStart=null,introDone=false;
var iGlobe=document.getElementById('intro-globe'),iLU=document.getElementById('intro-lu');
function introEase(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}
function introTick(ts){
  if(!introStart)introStart=ts;
  var t=Math.min((ts-introStart)/INTRO_DUR,1);
  iGlobe.style.transform='rotate('+(introEase(t)*720)+'deg)';
  iLU.style.transform='rotate('+(introEase(t)*-360)+'deg)';
  if(t>=1&&!introDone){
    introDone=true;
    document.getElementById('intro').classList.add('done');
    document.getElementById('main').classList.add('visible');
    var veil=document.getElementById('veil');
    if(veil){veil.style.opacity='0';setTimeout(function(){veil.style.display='none';},350);}
    if(!isMob) rng.style.opacity='1';
  }
  requestAnimationFrame(introTick);
}
requestAnimationFrame(introTick);

/* ── COPYRIGHT MAGNET ── */
(function(){
  var el=document.getElementById('copyright-magnet');
  if(!el)return;
  var text='left unsaid '+new Date().getFullYear()+' ©';
  var chars=[],offsets=[];
  text.split('').forEach(function(ch){
    var s=document.createElement('span');
    s.className='mc';
    s.textContent=ch===' '?'\u2003':ch;
    el.appendChild(s); chars.push(s);
    offsets.push({x:0,y:0,vx:0,vy:0});
  });
  el.addEventListener('click',function(){triggerChaos();});
  (function loop(){
    var er=el.getBoundingClientRect();
    var ecx=er.left+er.width/2,ecy=er.top+er.height/2;
    var dist=Math.sqrt(Math.pow(gMX-ecx,2)+Math.pow(gMY-ecy,2));
    var inZone=gMY>innerHeight*0.7&&dist<300;
    chars.forEach(function(ch,i){
      var r=ch.getBoundingClientRect();
      var cx=r.left+r.width/2,cy=r.top+r.height/2;
      var dx=gMX-cx,dy=gMY-cy,d=Math.sqrt(dx*dx+dy*dy);
      var tx=0,ty=0;
      if(inZone&&d<220){var s=0.55*(1-d/220);tx=clamp(dx*s,-60,60);ty=clamp(dy*s*0.7,-60,60);}
      var o=offsets[i];
      o.vx=(o.vx+(tx-o.x)*0.13)*0.67; o.vy=(o.vy+(ty-o.y)*0.13)*0.67;
      o.x+=o.vx; o.y+=o.vy;
      ch.style.transform='translate('+o.x.toFixed(2)+'px,'+o.y.toFixed(2)+'px)';
    });
    requestAnimationFrame(loop);
  })();
})();

/* ── CHAOS ── */
function triggerChaos(){
  var flash=document.getElementById('chaos-flash');
  var cx=innerWidth/2,cy=innerHeight/2;
  document.body.style.pointerEvents='none';
  var targets=[document.querySelector('nav'),document.querySelector('footer'),document.getElementById('globe-canvas')].filter(Boolean);
  targets.forEach(function(el,i){
    var r=el.getBoundingClientRect();
    el.style.cssText='position:fixed!important;top:'+r.top+'px!important;left:'+r.left+'px!important;width:'+r.width+'px!important;height:'+r.height+'px!important;margin:0!important;padding:0!important;z-index:'+(9000+i)+'!important;will-change:transform,opacity,filter;transition:none!important;';
  });
  flash.style.display='block';flash.style.opacity='1';
  setTimeout(function(){flash.style.transition='opacity .35s';flash.style.opacity='0';},60);
  setTimeout(function(){
    targets.forEach(function(el,i){
      var ang=Math.atan2(cy-(parseFloat(el.style.top)+parseFloat(el.style.height)/2),cx-(parseFloat(el.style.left)+parseFloat(el.style.width)/2));
      var dist=rand(1100,2200);
      var tx=Math.cos(ang)*dist+rand(-120,120),ty=Math.sin(ang)*dist+rand(-120,120);
      var dur=rand(520,820);
      el.style.transition='transform '+dur+'ms cubic-bezier(.15,0,.6,.2),opacity '+dur+'ms,filter '+dur+'ms';
      el.style.transform='translate('+tx.toFixed(0)+'px,'+ty.toFixed(0)+'px) rotate('+rand(-220,220).toFixed(0)+'deg) scale('+rand(.04,.28).toFixed(3)+')';
      el.style.opacity='0';el.style.filter='blur(18px)';
    });
    for(var i=0;i<40;i++){(function(){
      var d=document.createElement('div');
      d.style.cssText='position:fixed;pointer-events:none;z-index:99997;width:'+rand(3,22)+'px;height:'+rand(1,5)+'px;background:rgba(255,255,255,'+rand(.3,.9)+');left:'+cx+'px;top:'+cy+'px;will-change:transform,opacity;';
      document.body.appendChild(d);
      var a=rand(0,Math.PI*2),dt=rand(350,1600),r=rand(350,1600);
      setTimeout(function(){d.style.transition='transform '+dt+'ms,opacity '+dt+'ms';d.style.transform='translate('+Math.cos(a)*r+'px,'+Math.sin(a)*r+'px) rotate('+rand(-540,540)+'deg)';d.style.opacity='0';setTimeout(function(){d.parentNode&&d.parentNode.removeChild(d);},dt+50);},rand(0,150));
    })();}
  },160);
  setTimeout(function(){
    var n=0;(function s(){if(n>=6){flash.style.transition='opacity .06s';flash.style.opacity='1';setTimeout(function(){window.location.href='https://leftunsaid.world/secret';},80);return;}flash.style.transition='none';flash.style.opacity=n%2===0?'0.85':'0';n++;setTimeout(s,55);})();
  },980);
}

})();
