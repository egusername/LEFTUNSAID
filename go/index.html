<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>leftunsaid.mp3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #000; }
    .screen { display: none; flex-direction: column; align-items: center; text-align: center; padding: 2rem; }
    .screen.active { display: flex; }
    button, .btn { padding: 12px 24px; border: 1px solid #333; border-radius: 8px; font-size: 15px; cursor: pointer; background: #000; margin: 6px; text-decoration: none; color: #fff; display: inline-block; }
    button:hover, .btn:hover { background: #111; }
  </style>
</head>
<body>

<div id="redirect-screen" class="screen active">
  <p style="color:#555; margin-bottom:0.5rem;">Opening Instagram...</p>
  <p id="countdown" style="color:#333; font-size:13px;">Falling back in 3s</p>
</div>

<div id="fallback-screen" class="screen">
  <p style="color:#555; margin-bottom:2rem;">Couldn't open the app automatically.</p>
  <a href="https://instagram.com/leftunsaid.mp3" class="btn">Open Instagram</a>
  <button onclick="showLanding()">Explore</button>
</div>

<div id="landing-screen" class="screen">
  <p style="color:#555; margin-bottom:2rem;">Welcome — add whatever you like here.</p>
  <a href="https://instagram.com/leftunsaid.mp3" class="btn">Follow on Instagram</a>
</div>

<script>
  var appOpened = false;

  document.addEventListener('visibilitychange', function() {
    if (document.hidden && !appOpened) {
      appOpened = true;
      history.replaceState(null, '', window.location.href);
      document.getElementById('redirect-screen').className = 'screen';
      document.getElementById('landing-screen').className = 'screen active';
    }
  });

  window.location = "instagram://user?username=leftunsaid.mp3";

  var secs = 3;
  var interval = setInterval(function() {
    secs--;
    document.getElementById('countdown').textContent = 'Falling back in ' + secs + 's';
    if (secs <= 0) {
      clearInterval(interval);
      if (!appOpened) {
        document.getElementById('redirect-screen').className = 'screen';
        document.getElementById('fallback-screen').className = 'screen active';
      }
    }
  }, 1000);

  function showLanding() {
    document.getElementById('fallback-screen').className = 'screen';
    document.getElementById('landing-screen').className = 'screen active';
  }
</script>
</body>
</html>
