<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>leftunsaid.mp3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #fff; }
    .screen { display: none; flex-direction: column; align-items: center; text-align: center; padding: 2rem; }
    .screen.active { display: flex; }
    .avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; font-size: 2rem; }
    button, .btn { padding: 12px 24px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; cursor: pointer; background: white; margin: 6px; text-decoration: none; color: black; display: inline-block; }
  </style>
</head>
<body>

<div id="redirect-screen" class="screen active">
  <div class="avatar">📷</div>
  <p style="color:#888; margin-bottom:0.5rem;">Opening Instagram...</p>
  <p id="countdown" style="color:#bbb; font-size:13px;">Falling back in 3s</p>
</div>

<div id="fallback-screen" class="screen">
  <div class="avatar">📷</div>
  <h2 style="margin-bottom:0.5rem;">leftunsaid.mp3</h2>
  <p style="color:#888; margin-bottom:2rem;">Couldn't open the app automatically.</p>
  <a href="https://instagram.com/leftunsaid.mp3" class="btn">Open Instagram</a>
  <button onclick="showLanding()">Explore</button>
</div>

<div id="landing-screen" class="screen">
  <div class="avatar">🎵</div>
  <h2 style="margin-bottom:0.5rem;">leftunsaid.mp3</h2>
  <p style="color:#888; margin-bottom:2rem;">Welcome — add whatever you like here.</p>
  <a href="https://instagram.com/leftunsaid.mp3" class="btn">Follow on Instagram</a>
</div>

<script>
  var appOpened = false;

  document.addEventListener('visibilitychange', function() {
    if (document.hidden && !appOpened) {
      appOpened = true;
      // App opened — replace browser history so back button won't return to redirect
      history.replaceState(null, '', window.location.href);
      // Swap to landing page
      document.getElementById('redirect-screen').className = 'screen';
      document.getElementById('landing-screen').className = 'screen active';
    }
  });

  window.location = "instagram://user?username=leftunsaid.mp3";

  var secs = 3;
  var interval = setInterval(function() {
    secs--;
    document.getElementById('countdown').textContent = 'Falling back in ' + secs + 's';
    if (secs <= 0) {
      clearInterval(interval);
      if (!appOpened) {
        document.getElementById('redirect-screen').className = 'screen';
        document.getElementById('fallback-screen').className = 'screen active';
      }
    }
  }, 1000);

  function showLanding() {
    document.getElementById('fallback-screen').className = 'screen';
    document.getElementById('landing-screen').className = 'screen active';
  }
</script>
</body>
</html>
